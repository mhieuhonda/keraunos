# Build the kernel for the bare-metal x86-64 target by default.
# Override per invocation with `cargo build --target <triple>` (used for
# cross-architecture checks, e.g. aarch64-unknown-none).
[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    # The multiboot2 header embeds a 32-bit absolute entry address; static
    # relocation makes that link cleanly at the 1 MiB load address.
    "-C", "relocation-model=static",
]

[target.aarch64-unknown-none]
rustflags = ["-C", "relocation-model=static"]

[target.riscv64gc-unknown-none-elf]
rustflags = ["-C", "relocation-model=static"]
