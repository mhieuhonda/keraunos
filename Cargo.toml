[workspace]
resolver = "2"
members = ["kernel", "UI"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Keraunos Contributors"]
license = "MIT"

# Two crates today: the kernel and the native desktop (UI/). Further crates
# (hal, drivers, userland tooling, the Linux-ABI compatibility layer) join
# this workspace as the roadmap advances — see docs/ROADMAP.md.

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = "thin"
codegen-units = 1
