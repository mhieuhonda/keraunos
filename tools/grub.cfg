# GRUB2 configuration for the Keraunos boot ISO.
#
# The console directives mirror the kernel onto the serial line so that
# headless boots (CI, servers, IP-KVM-less debugging) show the boot menu,
# GRUB loader diagnostics and any loader errors on COM1 as well.

serial --unit=0 --speed=115200
terminal_input --append serial
terminal_output --append serial

set timeout=0
set default=0

menuentry "Keraunos" {
    echo "keraunos: loading kernel ..."
    multiboot2 /boot/kernel.elf console=uart log=verbose
    echo "keraunos: hand-off complete"
}
